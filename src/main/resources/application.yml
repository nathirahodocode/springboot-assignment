server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: assignment-service

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:TESTDB};encrypt=true;trustServerCertificate=true;
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: AssignmentHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        jdbc:
          batch_size: 20

  lifecycle:
    timeout-per-shutdown-phase: 20s

external:
  api:
    base-url: https://jsonplaceholder.typicode.com
    connect-timeout-ms: 5000
    read-timeout-ms: 5000
    max-total-connections: 100
    max-connections-per-route: 20

logging:
  file:
    name: logs/application.log
  level:
    root: INFO
    com.example.assignment: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics